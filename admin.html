<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raghad Makeup | الإدارة</title><link rel="stylesheet" href="style.css"></head><body><main>
<section class="card"><h2>لوحة إدارة Raghad Makeup</h2><form id="login"><label>البريد الإلكتروني<input id="email" type="email" required></label><label>كلمة المرور<input id="password" type="password" required></label><button class="btn">دخول</button><p id="loginMsg" class="msg"></p></form></section>
<section class="card" id="dashboard" hidden><div class="two"><button class="btn" id="refresh">تحديث الحجوزات</button><button class="btn" id="logout">تسجيل خروج</button></div><div id="bookings"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const c=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const login=document.getElementById('login'),dash=document.getElementById('dashboard');
login.onsubmit=async e=>{e.preventDefault();const {error}=await c.auth.signInWithPassword({email:email.value,password:password.value});loginMsg.textContent=error?'بيانات الدخول غير صحيحة ❌':'تم الدخول ✅';if(!error){login.style.display='none';dash.hidden=false;load()}};
async function load(){const {data,error}=await c.from('bookings').select('*').order('booking_date',{ascending:true});const box=document.getElementById('bookings');box.innerHTML=error?'<p>تعذر تحميل الحجوزات.</p>':data.map(x=>`<article class="grid article"><div><b>${x.customer_name}</b><br>${x.phone}</div><div>${x.service}<br>${x.booking_date} — ${x.booking_time}</div><div>${x.notes||''}<br><b>${x.status||'جديد'}</b></div></article>`).join('')||'<p>لا توجد حجوزات.</p>'}
refresh.onclick=load;logout.onclick=async()=>{await c.auth.signOut();location.reload()};</script></body></html>
