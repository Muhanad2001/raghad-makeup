<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة حجوزات رغد | Raghad Makeup</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f4f6;
  color:#382832;
}

header{
  background:#382832;
  color:white;
  padding:25px 18px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
  font-size:25px;
}

header p{
  margin:0;
  opacity:.85;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.login-box,
.dashboard{
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login-box{
  max-width:430px;
  margin:50px auto;
}

h2{
  margin-top:0;
}

input,
button,
select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}

input{
  margin-bottom:12px;
}

button{
  background:#382832;
  color:white;
  border:0;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.error{
  color:#c62828;
  margin-top:12px;
}

.topbar{
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.logout{
  width:auto;
  background:#8b5e68;
  padding:10px 18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:25px;
}

.stat{
  background:#f8edf1;
  border-radius:14px;
  padding:18px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.booking{
  border:1px solid #eee;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  background:#fff;
}

.booking-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.booking h3{
  margin:0;
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.info div{
  background:#faf7f8;
  padding:10px;
  border-radius:10px;
}

.label{
  font-size:12px;
  color:#888;
  display:block;
  margin-bottom:4px;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.pending{
  background:#fff3cd;
  color:#856404;
}

.confirmed{
  background:#d8f3dc;
  color:#1b5e20;
}

.cancelled{
  background:#f8d7da;
  color:#842029;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  width:auto;
  flex:1;
}

.confirm{
  background:#2e7d32;
}

.cancel{
  background:#b3261e;
}

.empty{
  text-align:center;
  padding:40px;
  color:#777;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .info{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<h1>💄 Raghad Makeup</h1>
<p>لوحة إدارة الحجوزات</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginSection" class="login-box">

<h2>🔐 دخول الإدارة</h2>

<input
  type="email"
  id="email"
  placeholder="البريد الإلكتروني"
>

<input
  type="password"
  id="password"
  placeholder="كلمة المرور"
>

<button onclick="login()">دخول</button>

<div id="loginMsg" class="error"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard" style="display:none;">

<div class="topbar">

<div>
<h2>📋 الحجوزات</h2>
<p>إدارة حجوزات العميلات</p>
</div>

<button class="logout" onclick="logout()">تسجيل الخروج</button>

</div>


<div class="stats">

<div class="stat">
الحجوزات
<strong id="totalCount">0</strong>
</div>

<div class="stat">
قيد الانتظار
<strong id="pendingCount">0</strong>
</div>

<div class="stat">
المؤكدة
<strong id="confirmedCount">0</strong>
</div>

</div>


<div class="filters">

<input
 id="search"
 placeholder="🔎 البحث بالاسم أو الهاتف"
 oninput="renderBookings()"
>

<select id="statusFilter" onchange="renderBookings()">
<option value="all">كل الحالات</option>
<option value="pending">قيد الانتظار</option>
<option value="confirmed">مؤكد</option>
<option value="cancelled">ملغي</option>
</select>

</div>


<div id="bookingsList">
<div class="empty">جاري تحميل الحجوزات...</div>
</div>

</div>

</div>


<script>

const SUPABASE_URL = "https://ulzajfcyjfwxtqppngjh.supabase.co";
const SUPABASE_KEY = "sb_publishable_8HSzzkSDYeqg67Dt7P1ctg_QfA00gAU";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let bookings = [];


/* LOGIN */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("loginMsg");

msg.innerText = "";

if(!email || !password){
msg.innerText = "أدخل البريد وكلمة المرور";
return;
}

const {error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
msg.innerText =
"بيانات الدخول غير صحيحة ❌";
console.error(error);
return;
}

showDashboard();

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

document.getElementById("dashboard")
.style.display="none";

document.getElementById("loginSection")
.style.display="block";

}


/* SHOW DASHBOARD */

function showDashboard(){

document.getElementById("loginSection")
.style.display="none";

document.getElementById("dashboard")
.style.display="block";

loadBookings();

}


/* LOAD BOOKINGS */

async function loadBookings(){

const {data,error} =
await supabaseClient
.from("bookings")
.select("*")
.order("created_at",{ascending:false});

if(error){

document.getElementById("bookingsList").innerHTML =
`
<div class="empty">
❌ حدث خطأ في تحميل الحجوزات
<br><br>
${error.message}
</div>
`;

console.error(error);
return;

}

bookings = data || [];

renderBookings();

}


/* RENDER */

function renderBookings(){

const search =
document.getElementById("search")
.value
.toLowerCase();

const status =
document.getElementById("statusFilter")
.value;

let filtered = bookings.filter(b => {

const name =
(b.customer_name || "").toLowerCase();

const phone =
(b.phone || "").toLowerCase();

const matchesSearch =
name.includes(search) ||
phone.includes(search);

const bookingStatus =
b.status || "pending";

const matchesStatus =
status === "all" ||
bookingStatus === status;

return matchesSearch && matchesStatus;

});


document.getElementById("totalCount")
.innerText = bookings.length;

document.getElementById("pendingCount")
.innerText =
bookings.filter(b =>
(b.status || "pending") === "pending"
).length;

document.getElementById("confirmedCount")
.innerText =
bookings.filter(b =>
b.status === "confirmed"
).length;


const list =
document.getElementById("bookingsList");

if(filtered.length === 0){

list.innerHTML =
`
<div class="empty">
لا توجد حجوزات حالياً 📭
</div>
`;

return;

}


list.innerHTML =
filtered.map(b => {

const status =
b.status || "pending";

let statusText =
"قيد الانتظار";

if(status === "confirmed"){
statusText = "مؤكد";
}

if(status === "cancelled"){
statusText = "ملغي";
}

return `

<div class="booking">

<div class="booking-header">

<h3>
👩🏻 ${escapeHtml(b.customer_name || "بدون اسم")}
</h3>

<span class="status ${status}">
${statusText}
</span>

</div>


<div class="info">

<div>
<span class="label">رقم الهاتف</span>
${escapeHtml(b.phone || "-")}
</div>

<div>
<span class="label">الخدمة</span>
${escapeHtml(b.service || "-")}
</div>

<div>
<span class="label">تاريخ الحجز</span>
${escapeHtml(b.booking_date || "-")}
</div>

<div>
<span class="label">وقت الحجز</span>
${escapeHtml(b.booking_time || "-")}
</div>

<div>
<span class="label">ملاحظات</span>
${escapeHtml(b.notes || "-")}
</div>

<div>
<span class="label">رقم الحجز</span>
${b.id}
</div>

</div>


<div class="actions">

<button
class="confirm"
onclick="updateStatus(${b.id},'confirmed')">
✅ تأكيد الحجز
</button>

<button
class="cancel"
onclick="updateStatus(${b.id},'cancelled')">
❌ إلغاء الحجز
</button>

</div>

</div>

`;

}).join("");

}


/* UPDATE STATUS */

async function updateStatus(id,status){

const {error} =
await supabaseClient
.from("bookings")
.update({status:status})
.eq("id",id);

if(error){

alert("حدث خطأ ❌");

console.error(error);

return;

}

alert(
status === "confirmed"
?
"تم تأكيد الحجز ✅"
:
"تم إلغاء الحجز ❌"
);

loadBookings();

}


/* SECURITY */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text);

return div.innerHTML;

}


/* CHECK SESSION */

(async function(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){
showDashboard();
}

})();

</script>

</body>
</html>
